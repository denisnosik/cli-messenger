name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      
      - name: Run gosec
        run: gosec ./...
        
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...
      
      - name: Run docker compose
        run: docker compose -f docker-compose.ci.yml up --build -d
      - name: Wait for server to be healthy
        run: |
          CONTAINER_ID=$(docker compose -f docker-compose.ci.yml ps -q server)
          timeout 60 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $CONTAINER_ID)\" = 'healthy' ]; do sleep 2; done"
      
      - name: Run tests
        run: go test -cover ./...
      
      - name: Dump server logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs server
      
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
  
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Check formatting issues
        run: test -z "$(gofmt -l .)"
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2
      
      - name: Run staticcheck
        run: staticcheck ./...